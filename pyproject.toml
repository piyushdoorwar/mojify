[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mojify"
# Version is derived from git tags by setuptools-scm (see [tool.setuptools_scm]).
dynamic = ["version"]
description = "A Wayland-native emoji picker for Ubuntu/GNOME — search, select, paste."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Piyush Doorwar", email = "piyushdoorwar+mojify@gmail.com" },
]
keywords = ["emoji", "picker", "wayland", "ubuntu", "gnome", "gtk", "clipboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# PyGObject (GTK) ships with Ubuntu's GNOME desktop and is awkward to install
# from PyPI, so it is intentionally NOT declared as a hard dependency here.
# The only runtime requirement outside the standard desktop is `wl-clipboard`
# (the `wl-copy` binary), installed via apt — see the README.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/piyushdoorwar/mojify"
Repository = "https://github.com/piyushdoorwar/mojify"
Issues = "https://github.com/piyushdoorwar/mojify/issues"

[project.scripts]
mojify = "mojify.__main__:main"

[tool.setuptools]
packages = ["mojify"]

[tool.setuptools.package-data]
# Ship the GTK stylesheet, logo, and tab icons inside the wheel/sdist.
mojify = ["style.css", "logo.svg", "icons/*.svg"]

[tool.setuptools_scm]
# Derive the version from the latest `vX.Y.Z` git tag. Also writes the
# resolved version to a generated file so `mojify --version` works when the
# package is run straight from a source checkout (not just an installed wheel).
version_file = "mojify/_version.py"

