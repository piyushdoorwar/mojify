<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mojify logo">
  <defs>
    <!-- Soft mint accent, matching the app's "Charcoal & Mint" theme. -->
    <linearGradient id="mint" x1="64" y1="48" x2="196" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fe6bd"/>
      <stop offset="1" stop-color="#5aa17f"/>
    </linearGradient>
    <linearGradient id="tile" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2522"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
  </defs>

  <!-- Tilted squircle "tile" = the floating picker window. -->
  <g transform="rotate(-8 128 128)">
    <rect x="40" y="40" width="176" height="176" rx="52" ry="52"
          fill="url(#tile)" stroke="#7fe0b0" stroke-opacity="0.55" stroke-width="3"/>

    <!-- Face. Mint eyes + a cheeky grin with a little tongue, nodding to the
         original smiley while becoming mojify's own mark. -->
    <ellipse cx="101" cy="108" rx="12" ry="16" fill="url(#mint)"/>
    <ellipse cx="159" cy="100" rx="12" ry="16" fill="url(#mint)"/>

    <!-- Grin -->
    <path d="M92 150 C 112 176, 152 172, 168 144"
          stroke="url(#mint)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- Tongue -->
    <path d="M126 167 a 11 11 0 0 0 21 -5 l -19 2 z" fill="#7fe0b0"/>

    <!-- Sparkle hint: the "pick / search" spark. -->
    <path d="M186 70 l 4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z"
          fill="#7fe0b0" fill-opacity="0.9"/>
  </g>
</svg>
